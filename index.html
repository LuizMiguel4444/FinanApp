    case 'novo-mes':abrirNovoMes();break;
    case 'mes-excluir':abrirExcluirMes();break;
    case 'prev-excluir':abrirExcluirPrev();break;
    case 'prev-excluir-ok':excluirPrev();break;
    case 'undo-prev':desfazerPrev();break;
    case 'mes-excluir-ok':excluirMes();break;
    case 'undo-mes':desfazerMes();break;
    case 'novo-mes-criar':criarMes();break;
    case 'mes-branco':criarMesEmBranco();break;
    case 'sheet-close':fecharSheet();break;
    case 'bar':escolherMes(t.dataset.k);S.aba='mes';S.scrollChip=true;render();window.scrollTo(0,0);break;
    case 'h-pessoa':S.H.pessoa=t.dataset.v||null;render();break;
    case 'h-inst':S.H.inst=t.dataset.v||null;render();break;
    case 'prev-sel':S.prevSel=t.dataset.k;S.scrollChip=true;render();break;
    case 'prev-novo':novaPrev();break;
    case 'linha':abrirLinha(t.dataset.b,t.dataset.t,t.dataset.id);break;
    case 'linha-nova':abrirLinha(t.dataset.b,t.dataset.t,null);break;
    case 'linha-salvar':salvarLinha();break;
    case 'linha-excluir':excluirLinha();break;
    case 'bloco-editar':abrirBloco(t.dataset.b);break;
    case 'bloco-novo':abrirBloco(null);break;
    case 'bloco-salvar':salvarBloco();break;
    case 'bloco-excluir':excluirBloco();break;
    case 'pessoa':abrirPessoa(t.dataset.id);break;
    case 'pessoa-nova':abrirPessoa(null);break;
    case 'pessoa-salvar':salvarPessoa();break;
    case 'pessoa-excluir':excluirPessoa();break;
    case 'inst-edit':abrirInst(t.dataset.id);break;
    case 'inst-nova':abrirInst(null);break;
    case 'inst-salvar':salvarInst();break;
    case 'inst-excluir':excluirInst();break;
    case 'cor':setCor(t.dataset.cor);break;
    case 'backup':case 'backup-agora':backup(false);break;
    case 'backup-direto':backup(true);break;
    case 'backup-depois':S.meta.adiarAviso=Date.now()+7*864e5;salvarMeta();render();break;
    case 'exp-csv':exportarCsv();break;
    case 'importar':$('#arq').value='';$('#arq').click();break;
    case 'import-substituir':aplicarImport('substituir');break;
    case 'import-mesclar':aplicarImport('mesclar');break;
    case 'restaurar':abrirRestaurar(+t.dataset.ts);break;
    case 'restaurar-ok':restaurar();break;
    case 'instalar':if(S.installEv){S.installEv.prompt();S.installEv.userChoice.then(function(){S.installEv=null;render();});}break;
    case 'lk-d':lkDigito(t.dataset.d);break;
    case 'lk-apagar':lkApagar();break;
    case 'lk-bio':lkBio();break;
    case 'lk-cancelar':lkCancelar();break;
    case 'lk-esqueci':lkEsqueci();break;
    case 'lk-rec-voltar':lkRecVoltar();break;
    case 'lk-cod-ok':lkUsarCodigo();break;
    case 'lk-apagar-tudo':lkApagarTudo();break;
    case 'lk-bloquear':bloquear();break;
    case 'lk-ativar':lkAtivar();break;
    case 'lk-n':if(S.edit&&S.edit.tipo==='lk'){S.edit.n=+t.dataset.n;document.querySelectorAll('[data-act="lk-n"]').forEach(function(b){b.setAttribute('aria-pressed',String(b===t));});}break;
    case 'lk-criar':if(S.edit&&S.edit.tipo==='lk'){var nn=S.edit.n;fecharSheet();lkAbrir({modo:'criar',n:nn,cancelavel:true,cb:function(pin){return lkConcluirCriacao(pin,nn);}});}break;
    case 'lk-trocar':lkVerificar(function(){lkAbrir({modo:'criar',n:lockCfg().pin.n,cancelavel:true,cb:lkConcluirTroca});});break;
    case 'lk-desativar':lkVerificar(function(){S.meta.bloqueio=null;salvarMeta();render();toast('Bloqueio desativado.');});break;
    case 'lk-novocod':lkVerificar(async function(){var cod=gerarCodigo(),rec=await novoSegredo(normCodigo(cod));lockCfg().rec=rec;salvarMeta();lkMostrarCodigo(cod,false);});break;
    case 'lk-biotoggle':lkBioToggle();break;
    case 'lk-copiar':try{navigator.clipboard.writeText(S.edit.cod).then(function(){toast('Código copiado.');},function(){toast('Não foi possível copiar. Anote o código.');});}catch(err){toast('Não foi possível copiar. Anote o código.');}break;
    case 'lk-guardei':var oferecer=S.edit&&S.edit.bio;fecharSheet();toast('Bloqueio ativado.');if(oferecer&&S.bioOk&&!bioAtiva())setTimeout(lkOferecerBio,320);break;
    case 'lk-bio-ativar':registrarBio().then(function(ok){fecharSheet();render();toast(ok?'Digital ou rosto ativado.':'Não foi possível ativar a digital ou o rosto.');});break;
    case 'esc-edit-prox':aplicarEdicaoCadeia();break;
    case 'esc-edit-so':if(S.edit&&S.edit.tipo==='esc-edit'){var ee=S.edit;fecharSheet();salvarMes(ee.k,ee.doc);}break;
    case 'esc-del-prox':excluirEscopo(true);break;
    case 'esc-del-so':excluirEscopo(false);break;
    case 'undo-lote':desfazerLote();break;
    case 'tema':try{localStorage.setItem('cf-tema',t.dataset.t);}catch(err){}aplicarTema(t.dataset.t);render();break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t||!t.dataset)return;
  if(t.dataset.fech!==undefined&&S.aba==='mes')salvarFech(t);
  else if(t.id==='f-inst'&&S.edit&&S.edit.tipo==='item'){S.edit.vtmp=Object.assign({},S.edit.vtmp,lerVals());S.edit.inst=t.value;$('#vals-bloco').innerHTML=htmlVals();}
  else if(t.dataset.hsel==='h-de'){S.H.de=t.value;if(S.H.ate&&S.H.ate<t.value)S.H.ate=t.value;render();}
  else if(t.dataset.hsel==='h-ate'){S.H.ate=t.value;if(S.H.de&&S.H.de>t.value)S.H.de=t.value;render();}
  else if(t.id==='arq'&&t.files&&t.files[0])lerArquivo(t.files[0]);
  else if(t.id==='nm-alvo'){abrirNovoMes(t.value);}
  else if(t.id==='lk-auto'&&lockCfg()){S.meta.bloqueio.auto=+t.value;salvarMeta();}
  else if(t.id==='f-rec')atualizarDicaParc();
});
var tBusca=null;
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='busca'||t.id==='hbusca'){
    clearTimeout(tBusca);
    tBusca=setTimeout(function(){if(t.id==='busca')S.F.busca=t.value.trim();else S.H.busca=t.value.trim();render();},140);
  }else if(t.id==='lk-apagar-txt'){lkEl('lk-apagar-btn').disabled=t.value.trim().toUpperCase()!=='APAGAR';
  }else if(t.dataset&&t.dataset.fech!==undefined&&t.dataset.fech!=='notas')fechAtualizar();
  else if(t.id==='f-px'||t.id==='f-py')atualizarDicaParc();
  else if(t.id==='a-qtd')adAtualizarValor();
  else if(t.id==='a-valor'&&S.edit&&S.edit.tipo==='adiantar')S.edit.editouValor=true;
});
document.addEventListener('toggle',function(e){
  if(e.target&&e.target.hasAttribute&&e.target.hasAttribute('data-fech-det'))S.fechAberto=e.target.open;
},true);
document.addEventListener('keydown',function(e){
  if(!lkEl('lock').hidden){
    if(!lkEl('lk-teclado').hidden){
      if(/^[0-9]$/.test(e.key)){e.preventDefault();lkDigito(e.key);}
      else if(e.key==='Backspace'){e.preventDefault();lkApagar();}
      else if(e.key==='Escape')lkCancelar();
    }
    return;
  }
  if(e.key==='Escape'&&!$('#sheet').hidden)fecharSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){
    if(S.idb)snapSeNecessario();
    if(lockAtivo()){document.body.classList.add('cobrir');if(!S.bloqueado)S.ocultoEm=Date.now();}
  }else{
    document.body.classList.remove('cobrir');
    var B=lockCfg();
    if(B&&!S.bloqueado&&S.ocultoEm){
      if((Date.now()-S.ocultoEm)/1000>=(B.auto==null?60:B.auto))bloquear();
    }
    S.ocultoEm=0;
  }
});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();S.installEv=e;if(S.aba==='ajustes')render();});
window.addEventListener('appinstalled',function(){S.installEv=null;if(S.aba==='ajustes')render();});

/* =========================================================
   Início
   ========================================================= */
async function init(){
  aplicarTema(temaAtual());
  render();
  if(!window.indexedDB){setStatus('sem-idb');S.pronto=true;render();return;}
  try{
    await carregar();
  }catch(e){setStatus('sem-idb');S.pronto=true;render();return;}
  S.pronto=true;setStatus('salvo');
  var acao=new URLSearchParams(location.search).get('acao');
  if(lockAtivo())S.bloqueado=true;
  render();
  if(S.bloqueado){S.acaoPendente=(acao==='nova-compra')?acao:null;lkAbrirUnlock();}
  protegerArmazenamento().then(function(){if(S.aba==='ajustes'&&!S.bloqueado)render();});
  bioDisponivel().then(function(v){S.bioOk=v;if(S.aba==='ajustes'&&!S.bloqueado)render();});
  snapSeNecessario();
  if(acao==='nova-compra'&&!S.bloqueado&&mesKeys().length)abrirItem(null);
  if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
}
init();
})();
</script>
</body>
