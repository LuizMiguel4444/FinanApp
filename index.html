<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinanApp</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F6FA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1016">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Compras parceladas, cartões e previsão do mês, com histórico guardado no seu aparelho.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FinanApp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --ink:#171B26; --ink2:#5A6275; --line:#E2E5EE; --line2:#EEF0F6;
  --ok:#17803F; --bad:#C0352B; --warn:#B45309; --accent:#8A05BE;
  --fd:ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1016; --surface:#171A23; --ink:#EDEFF6; --ink2:#9AA3B8; --line:#2A2F3D; --line2:#212533;
    --ok:#4CC27A; --bad:#FF7A70; --warn:#F2A33A; --accent:#B65CE6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1016; --surface:#171A23; --ink:#EDEFF6; --ink2:#9AA3B8; --line:#2A2F3D; --line2:#212533;
  --ok:#4CC27A; --bad:#FF7A70; --warn:#F2A33A; --accent:#B65CE6; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;
  padding:env(safe-area-inset-top,0px) 0 calc(96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--fd);margin:0;font-weight:750;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.top h1{font-size:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink2);padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ink2)}
.pill.ok i{background:var(--ok)} .pill.wait i{background:var(--warn)} .pill.bad{color:var(--bad)} .pill.bad i{background:var(--bad)}

.chips{position:relative;display:flex;gap:6px;overflow-x:auto;padding:6px 16px 10px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:48px;text-align:center;padding:8px 12px;border-radius:99px;font-weight:600;font-size:14px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);position:relative;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[data-hoje]::after{content:"";position:absolute;top:5px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.chip.add{border-style:dashed;color:var(--accent)}
.chip.sm{padding:6px 11px;font-size:13px;min-width:0}
.chip .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}

.mes-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 12px}
.mes-head h2{font-size:30px;line-height:1.05}
.mes-head h2 small{font:600 15px system-ui,sans-serif;color:var(--ink2);margin-left:6px}
.mes-total{text-align:right;font-size:13px;color:var(--ink2);line-height:1.2}
.mes-total b{display:block;font:750 19px var(--fd);color:var(--ink)}

.busca-linha{display:flex;gap:8px;margin:0 0 10px}
.busca-linha input[type=search]{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.btn-filtro{flex:none;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:flex;gap:6px;align-items:center}
.btn-filtro b{background:var(--ink);color:var(--bg);border-radius:99px;min-width:20px;height:20px;font-size:12px;display:grid;place-items:center;padding:0 5px}
.ativos{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.ativos button{font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--line2);color:var(--ink)}
.ativos button::after{content:" ×";color:var(--ink2)}

.insts{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.insts::-webkit-scrollbar{display:none}
.inst{flex:none;min-width:128px;padding:11px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:2px}
.inst .cn{font-size:13px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px;white-space:nowrap}
.inst .cn::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--cc,var(--ink2))}
.inst .cv{font:750 20px var(--fd)}
.inst[aria-selected="true"]{border-color:var(--cc,var(--ink));background:var(--surface);box-shadow:inset 0 0 0 1px var(--cc,var(--ink))}
@supports (background:color-mix(in srgb,red 10%,white)){
  .inst[aria-selected="true"]{background:color-mix(in srgb,var(--cc,#888) 12%,var(--surface))}
}
.pessoas{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.pp-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;color:var(--ink2);white-space:nowrap}
.pp-btn i,.pp i{width:9px;height:9px;border-radius:50%;flex:none}
.pp-btn b{color:var(--ink);font-weight:600}
.pp-btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pp b{color:var(--ink);font-weight:600}

.lista{margin:8px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:block;width:100%;padding:13px 16px;border-bottom:1px solid var(--line2)}
.item:last-child{border-bottom:0}
.item:active{background:var(--line2)}
.item .l1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item .nome{font-weight:600;font-size:15.5px}
.tag{margin-left:8px;font-size:11.5px;font-weight:600;color:var(--ink2);border:1px solid var(--line);padding:1px 7px;border-radius:99px;vertical-align:1px;white-space:nowrap}
.item .val{font-weight:700;white-space:nowrap}
.item .l2{display:flex;align-items:center;gap:10px;margin-top:8px}
.regua{flex:1;display:flex;gap:2px;height:7px}
.seg{flex:1;border-radius:2px;background:var(--line)}
.seg.done{background:var(--cc);opacity:.4}
.seg.now{background:var(--cc)}
.barra{flex:1;height:7px;border-radius:3px;background:var(--line);overflow:hidden}
.barra i{display:block;height:100%;background:var(--cc)}
.parc{font-size:12.5px;font-weight:600;color:var(--ink2);min-width:38px;text-align:right}
.item .l3{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--ink2)}
.item .l4{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:6px;font-size:12.5px;color:var(--ink2)}
.item .l4 .ad{color:var(--ok);font-weight:600}
.instlab{display:inline-flex;align-items:center;gap:5px}
.instlab i{width:8px;height:8px;border-radius:2px;background:var(--cc)}
.mut{color:var(--ink2)}
.vazio-lista{padding:22px 16px;text-align:center;color:var(--ink2)}

details.fech{margin:16px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.fech>summary{list-style:none;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.fech>summary::-webkit-details-marker{display:none}
details.fech>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);transition:transform .15s}
details.fech[open]>summary::after{transform:rotate(-135deg)}
.fech-body{padding:0 16px 16px}
.fech-body h4{margin:14px 0 8px;font-size:13px;color:var(--ink2);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.fi{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink2)}
.fi input{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.fb{margin-top:16px}
.fb-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.fb-h span{font-weight:700}
.fb-tot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-weight:700}
.fb-tot span:last-child{font:750 19px var(--fd)}
.fech-sum{margin-left:auto;margin-right:12px;font-weight:700}
.fi input::placeholder{color:var(--ink2);opacity:.7}
.hint{font-size:12.5px;color:var(--ink2);margin:6px 0 0}

.btn{padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.block{display:block;width:100%}
.btn.sm{padding:8px 12px;font-size:14px}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:18px;background:var(--ink);color:var(--bg);font-size:28px;line-height:1;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:20;text-align:center}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--ink2);border-radius:10px;text-align:center}
.nav button[aria-current="page"]{color:var(--ink)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"] svg{stroke-width:2.3}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,18,.5);opacity:0;transition:opacity .18s;display:flex;align-items:flex-end;justify-content:center}
.overlay.open{opacity:1}
.panel{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(24px);transition:transform .18s;overscroll-behavior:contain}
.overlay.open .panel{transform:none}
.panel h2{font-size:22px}
.panel .sub{margin:2px 0 14px;color:var(--ink2);font-size:13.5px}
.f{display:flex;flex-direction:column;gap:4px;margin:0 0 12px;font-size:13px;color:var(--ink2);font-weight:600}
.f input,.f textarea,.f select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;font-weight:400;color:var(--ink)}
.f span{display:flex;align-items:center;gap:6px}
.f span i{width:9px;height:9px;border-radius:50%}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:6px 0 12px;font-size:14px;line-height:1.35}
.chk input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--ink)}
.acoes{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.acoes .sp{flex:1}
.grupo{margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--ink2)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 14px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;background-clip:padding-box;box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{border-color:var(--surface);box-shadow:0 0 0 2.5px var(--ink)}
.chipset{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.linkbtn{color:var(--accent);font-weight:600;font-size:13.5px;padding:2px 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card h3{font-size:17px;margin-bottom:4px}
.card .sub{margin:0 0 12px;color:var(--ink2);font-size:13px}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin-top:6px}
.legenda span{display:inline-flex;gap:6px;align-items:center}
.legenda i{width:9px;height:9px;border-radius:3px}
svg.graf{width:100%;height:auto;display:block}
svg.graf text{fill:var(--ink2);font:600 9.5px system-ui,sans-serif}
svg.graf text.sel{fill:var(--ink);font-weight:700}
svg.graf g[data-act]{cursor:pointer}
.tbl{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2)}
th{font-size:12px;color:var(--ink2);font-weight:600}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:600;padding-left:0}
td.t{font-weight:700}
tfoot td{border-top:1.5px solid var(--line);border-bottom:0;font-weight:700}
.venc{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13.5px}
.venc .m{width:56px;color:var(--ink2);font-weight:600}
.venc .b{flex:1;height:8px;border-radius:4px;background:var(--line2);overflow:hidden}
.venc .b i{display:block;height:100%;background:var(--accent);border-radius:4px}
.venc .v{min-width:82px;text-align:right;font-weight:600}
.and{padding:11px 0;border-bottom:1px solid var(--line2)}
.and:last-child{border-bottom:0}
.and .a1{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.and .a2{font-size:12.5px;color:var(--ink2);margin-top:2px}
.hfiltros .rot{font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 6px}
.hfiltros .rot:first-of-type{margin-top:0}
.hsel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hsel select,.hfiltros input[type=search]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.res{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.res:last-child{border-bottom:0}
.res .r2{font-size:12.5px;color:var(--ink2)}

.bloco{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.bloco header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.bloco header h3{font-size:19px}
.resta{font-weight:700;color:var(--ok)}
.resta.neg{color:var(--bad)}
.lin{display:flex;justify-content:space-between;gap:12px;width:100%;padding:11px 16px;border-bottom:1px solid var(--line2);align-items:baseline}
.lin small{display:block;color:var(--ink2);font-size:12px;line-height:1.3;margin-top:1px}
.lin.ent .v{color:var(--ok);font-weight:600}
.lin.sai .v{color:var(--bad);font-weight:600}
.lin .v{white-space:nowrap}
.lin.saldo{color:var(--ink2);background:var(--line2)}
.bloco .add{display:flex;gap:8px;padding:10px 12px}
.bloco .add button{flex:1;padding:9px;border:1px dashed var(--line);border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink2);text-align:center}

.row-ajuste{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--line2)}
.row-ajuste:last-of-type{border-bottom:0}
.row-ajuste .dot{width:12px;height:12px;border-radius:4px;flex:none}
.row-ajuste .rt{flex:1;min-width:0}
.row-ajuste .rt small{display:block;color:var(--ink2);font-size:12.5px}
.row-ajuste .arq{font-size:12px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px;gap:12px}
.kv:last-of-type{border-bottom:0}
.seg-tema{display:flex;gap:8px;margin-top:8px}
.seg-tema button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);text-align:center;font-weight:600;font-size:14px}
.seg-tema button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.aviso{margin:16px 0;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.aviso p{margin:0 0 10px;color:var(--ink2)}
.aviso .acoes{margin:0}
.vazio{text-align:center;padding:40px 8px}
.vazio h2{font-size:24px;margin-bottom:8px}
.vazio p{color:var(--ink2);margin:0 0 18px}
.vazio .btn{margin:4px}
.skel{height:180px;border-radius:14px;margin:16px 0;background:linear-gradient(90deg,var(--line2),var(--line),var(--line2));background-size:200% 100%;animation:sk 1.4s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{font-weight:700;text-decoration:underline;color:inherit;white-space:nowrap}

.top-dir{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2)}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:flex;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.lk-wrap{margin:auto;width:100%;max-width:340px;text-align:center;padding:24px 0}
.lk-logo{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 14px}
.lk-wrap h2{font-size:24px}
.lk-sub{margin:4px 0 0;color:var(--ink2);font-size:14px}
.lk-dots{display:flex;gap:14px;justify-content:center;margin:20px 0 8px}
.lk-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink2)}
.lk-dots i.on{background:var(--ink);border-color:var(--ink)}
.lk-dots.tremer{animation:lk-tremer .35s}
@keyframes lk-tremer{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.lk-msg{min-height:22px;margin:0 0 8px;color:var(--bad);font-size:14px}
.lk-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:290px;margin:6px auto 0}
.lk-pad.off{opacity:.4;pointer-events:none}
.lk-pad button{height:64px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font:600 26px var(--fd);display:grid;place-items:center;text-align:center;color:var(--ink)}
.lk-pad button:active{background:var(--line2)}
.lk-pad button.vazio{visibility:hidden}
.lk-pad svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lk-rodape{display:flex;justify-content:center;gap:20px;margin-top:20px}
.lk-rodape button{color:var(--accent);font-weight:600;font-size:14px;padding:6px}
.lk-sep{height:1px;background:var(--line);margin:22px 0}
#lk-rec{text-align:left}

<script>
(function(){
'use strict';

/* =========================================================
   Constantes e utilitários
   ========================================================= */
var VERSAO_APP='2.5.0';
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var ABR=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
var PALETA=['#8A05BE','#0B7FBF','#D6336C','#198F83','#C27803','#3C8D2F','#E8590C','#5C7CFA','#7048E8','#868E96'];
var TIPOS_INST={cartao:'Cartão de crédito',conta:'Conta ou débito',financiamento:'Financiamento ou empréstimo',outro:'Outro'};
var TIPOS_FILTRO=[['todos','Todas'],['parcelado','Parceladas'],['avista','À vista'],['recorrente','Repetem todo mês'],['terminando','Última parcela'],['adiantado','Com adiantamento']];
var ORDENS=[['padrao','Ordem da lista'],['valor','Maior valor'],['nome','Nome (A–Z)'],['restantes','Menos parcelas restantes']];

var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});};
var clone=function(o){return JSON.parse(JSON.stringify(o));};
var pad=function(n){return String(n).padStart(2,'0');};
var nf2=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
var nf0=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:0,maximumFractionDigits:0});
var brl=function(n){return nf2.format(Math.round((n||0)*100)/100);};
var brlc=function(n){n=Math.round((n||0)*100)/100;return Number.isInteger(n)?nf0.format(n):nf2.format(n);};
var num0=function(v){return(typeof v==='number'&&isFinite(v))?v:0;};
var novoId=function(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);};
var norm=function(s){return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();};
var slug=function(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';};
var fmtData=function(ts){return new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});};

function parseNum(s){
  s=String(s==null?'':s).trim().replace(/R\$\s?/,'');
  if(!s)return null;
  if(s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  var n=Number(s);return isFinite(n)?n:NaN;
}
function fmtIn(v){return v==null?'':String(v).replace('.',',');}
function parseParcela(p){var m=/^\s*(\d+)\s*\/\s*(\d+)/.exec(String(p==null?'':p));return m?{x:+m[1],y:+m[2]}:null;}
function lab(k){var a=k.split('-').map(Number);return{y:a[0],m:a[1],nome:MESES[a[1]-1],abr:ABR[a[1]-1]};}
function somaMeses(k,n){var a=k.split('-').map(Number),y=a[0],m=a[1]+n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m);}
function hojeKey(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function diaStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function diasNoMes(y,m){return new Date(y,m,0).getDate();}
/* Mês da fatura aberta hoje: passado o dia de fechamento, vale o mês seguinte. */
function mesDaFatura(I){
  var d=new Date(),y=d.getFullYear(),m=d.getMonth()+1,k=y+'-'+pad(m),f=I&&I.diaFechamento;
  return(f&&d.getDate()>Math.min(f,diasNoMes(y,m)))?somaMeses(k,1):k;
}
function algumFechamento(){return instsAtivas().some(function(I){return !!I.diaFechamento;});}
/* Mês que a aba Mês abre por padrão: com uma instituição escolhida vale o fechamento dela;
   em "Todas", o mês da fatura mais antiga que ainda está aberta. */
function mesAtualAlvo(){
  if(S.inst!=='todas'){var I=inst(S.inst);return(I&&I.diaFechamento)?mesDaFatura(I):hojeKey();}
  var ms=instsAtivas().filter(function(I){return !!I.diaFechamento;}).map(mesDaFatura).sort();
  return ms.length?ms[0]:hojeKey();
}
function melhorMes(keys,alvo){
  if(keys.indexOf(alvo)>-1)return alvo;
  var ant=keys.filter(function(k){return k<alvo;});
  return ant.length?ant[ant.length-1]:keys[0];
}
/* escolha do usuário vale até o fim do dia; depois a aba volta a seguir a fatura atual */
function escolherMes(k){S.mesSel=k;S.mesManualDia=diaStr();}
function escolher(lista,atual){if(atual&&lista.indexOf(atual)>-1)return atual;var h=hojeKey();return lista.indexOf(h)>-1?h:(lista[lista.length-1]||null);}
function mesCurto(k){var l=lab(k);return l.abr+'/'+String(l.y).slice(2);}

/* =========================================================
   Estado
   ========================================================= */
var S={
  aba:'mes',mesSel:null,inst:'todas',prevSel:null,
  D:{config:null,meses:{},prevs:{}},meta:{},
  pronto:false,status:'carregando',idb:null,pend:0,
  F:{pessoa:null,busca:'',tipo:'todos',categoria:null,ordem:'padrao'},
  H:{pessoa:null,inst:null,de:null,ate:null,busca:''},
  fechAberto:false,deletado:null,edit:null,novoMes:null,import:null,scrollChip:true,
  tt:null,closeT:null,sheetPushed:false,skipPop:false,installEv:null,persistido:null,snaps:[],
  bloqueado:false,acaoPendente:null,ocultoEm:0,bioOk:null,
  mesManualDia:null,alvoAtual:null,avisoFaturaOculto:null,prevExcluida:null
};
var mesKeys=function(){return Object.keys(S.D.meses).sort();};
var prevKeys=function(){return Object.keys(S.D.prevs).sort();};
var CFG=function(){return S.D.config;};
var pessoa=function(id){return CFG().pessoas.find(function(p){return p.id===id;});};
var inst=function(id){return CFG().instituicoes.find(function(i){return i.id===id;});};

function configPadrao(){
  return{versao:2,
    pessoas:[{id:'eu',nome:'Eu',cor:PALETA[3],ativa:true}],
    instituicoes:[{id:'cartao-1',nome:'Meu cartão',cor:PALETA[0],tipo:'cartao',pessoas:['eu'],ativa:true}]};
}

/* =========================================================
   Armazenamento local (IndexedDB)
   ========================================================= */
function abrirDB(){
  return new Promise(function(res,rej){
    var r=indexedDB.open('controle-financeiro',1);
    r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('kv');d.createObjectStore('snap',{keyPath:'ts'});};
    r.onsuccess=function(){var db=r.result;db.onversionchange=function(){db.close();try{location.reload();}catch(e){}};res(db);};
    r.onerror=function(){rej(r.error);};
  });
}
function idbReq(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function store(nome,modo){return S.idb.transaction(nome,modo).objectStore(nome);}
function gravarLote(entradas,limpar,apagar){
  return new Promise(function(res,rej){
    var t=S.idb.transaction('kv','readwrite'),st=t.objectStore('kv');
    if(limpar)st.clear();
    entradas.forEach(function(e){st.put(e[1],e[0]);});
    (apagar||[]).forEach(function(c){st.delete(c);});
    t.oncomplete=function(){res();};
    t.onerror=t.onabort=function(){rej(t.error);};
  });
}
function persist(chave,valor){
  S.pend++;setStatus('salvando');
  return gravarLote([[chave,valor]]).then(function(){S.pend--;if(!S.pend)setStatus('salvo');},function(){
    S.pend--;setStatus('erro');toast('Não foi possível salvar no aparelho. Baixe um backup agora.');
  });
}
function persistLote(put,del){
  S.pend++;setStatus('salvando');
  return gravarLote(put,false,del).then(function(){S.pend--;if(!S.pend)setStatus('salvo');},function(){
    S.pend--;setStatus('erro');toast('Não foi possível salvar no aparelho. Baixe um backup agora.');
  });
}
async function carregar(){
  S.idb=await abrirDB();
  var chaves=await idbReq(store('kv','readonly').getAllKeys());
  var vals=await idbReq(store('kv','readonly').getAll());
  chaves.forEach(function(k,i){
    if(k==='config')S.D.config=vals[i];
    else if(k==='meta')S.meta=vals[i]||{};
    else if(k.indexOf('mes:')===0)S.D.meses[k.slice(4)]=vals[i];
    else if(k.indexOf('prev:')===0)S.D.prevs[k.slice(5)]=vals[i];
  });
  if(!S.D.config){S.D.config=configPadrao();await persist('config',S.D.config);}
  var mud=limparNotasLegado(S.D);
  if(mud.length)await gravarLote(mud.map(function(c){var k=c.slice(c.indexOf(':')+1);return [c,c.indexOf('mes:')===0?S.D.meses[k]:S.D.prevs[k]];}),false);
}
function exportObj(){return{app:'finanapp',versao:2,exportadoEm:new Date().toISOString(),config:S.D.config,meses:S.D.meses,prevs:S.D.prevs};}
function temDados(){return mesKeys().length>0||prevKeys().length>0;}

/* cópias automáticas (histórico de segurança dentro do aparelho) */
async function criarSnap(motivo){
  if(!temDados())return;
  var ts=Date.now();
  await idbReq(store('snap','readwrite').put({ts:ts,motivo:motivo,dados:JSON.stringify(exportObj())}));
  var ks=await idbReq(store('snap','readonly').getAllKeys());
  ks.sort(function(a,b){return a-b;});
  var sobra=ks.length-20;
  for(var i=0;i<sobra;i++)await idbReq(store('snap','readwrite').delete(ks[i]));
}
async function listarSnaps(){
  var tudo=await idbReq(store('snap','readonly').getAll());
  S.snaps=tudo.map(function(s){return{ts:s.ts,motivo:s.motivo,n:Object.keys((JSON.parse(s.dados).meses)||{}).length};}).sort(function(a,b){return b.ts-a.ts;});
}
async function snapSeNecessario(){
  try{
    var ks=await idbReq(store('snap','readonly').getAllKeys());
    var ult=ks.length?Math.max.apply(null,ks):0;
    if(Date.now()-ult>20*3600*1000)await criarSnap('automática');
  }catch(e){}
}

/* mutações */
function salvarMes(k,doc){S.desfazer=null;S.D.meses[k]=doc;persist('mes:'+k,doc);render();}
function salvarPrev(k,doc){S.desfazer=null;S.D.prevs[k]=doc;persist('prev:'+k,doc);render();}
function salvarConfig(cfg){S.desfazer=null;S.D.config=cfg;persist('config',cfg);render();}
function salvarMeta(){persist('meta',S.meta);}

function setStatus(s){S.status=s;var el=$('#status');if(el)el.innerHTML=pill();}
function pill(){
  var m={carregando:['wait','Carregando…'],salvo:['ok','Salvo neste aparelho'],salvando:['wait','Salvando…'],erro:['bad','Erro ao salvar'],'sem-idb':['bad','Sem armazenamento']}[S.status]||['wait',''];
  return '<span class="pill '+m[0]+'"><i></i>'+m[1]+'</span>';
}

/* =========================================================
   Cálculos
   ========================================================= */
function somaV(l){return Object.keys(l.v||{}).reduce(function(s,k){return s+num0(l.v[k]);},0);}
function totalLanc(l){return somaV(l)+(l.adiant?num0(l.adiant.valor):0);}
function valorPessoa(l,pid){
  var base=num0(l.v&&l.v[pid]);
  if(!l.adiant||!base)return base;
  var sv=somaV(l);return base+(sv>0?base/sv*num0(l.adiant.valor):0);
}
function valorFiltrado(l,F){return F.pessoa?valorPessoa(l,F.pessoa):totalLanc(l);}
function restantes(l){
  var p=parseParcela(l.parcela);
  if(!p||l.recorrente||p.y<=1)return 9999;
  return Math.max(0,p.y-p.x-(l.adiant?num0(l.adiant.qtd):0));
}
function categorias(){
  var set={};
  Object.keys(S.D.meses).forEach(function(k){S.D.meses[k].lancamentos.forEach(function(l){if(l.categoria)set[l.categoria]=1;});});
  return Object.keys(set).sort(function(a,b){return a.localeCompare(b,'pt-BR');});
}
function usoPessoa(id){
  var n=0;
  Object.keys(S.D.meses).forEach(function(k){
    var d=S.D.meses[k];
    d.lancamentos.forEach(function(l){if(l.v&&l.v[id]!=null)n++;});
    Object.keys(d.fechamento||{}).forEach(function(ik){if(d.fechamento[ik]&&d.fechamento[ik][id]!=null)n++;});
  });
  return n;
}
function usoInst(id){
  var n=0;
  Object.keys(S.D.meses).forEach(function(k){S.D.meses[k].lancamentos.forEach(function(l){if(l.inst===id)n++;});});
  return n;
}
function pessoasAtivas(){return CFG().pessoas.filter(function(p){return p.ativa!==false;});}
function pessoasVisiveis(){return CFG().pessoas.filter(function(p){return p.ativa!==false||usoPessoa(p.id)>0;});}
function instsAtivas(){return CFG().instituicoes.filter(function(i){return i.ativa!==false;});}
function instsDoMes(doc){
  var usados={};doc.lancamentos.forEach(function(l){usados[l.inst]=1;});
  return CFG().instituicoes.filter(function(i){return i.ativa!==false||usados[i.id];});
}

function passa(l,F,ignPessoa){
  if(!ignPessoa&&F.pessoa&&valorPessoa(l,F.pessoa)<=0)return false;
  if(F.categoria&&(l.categoria||'')!==F.categoria)return false;
  if(F.busca&&norm(l.compra+' '+(l.nota||'')+' '+(l.categoria||'')).indexOf(norm(F.busca))<0)return false;
  var p=parseParcela(l.parcela),par=p&&p.y>1&&!l.recorrente;
  switch(F.tipo){
    case 'parcelado':if(!par)return false;break;
    case 'avista':if(l.recorrente||(p&&p.y>1))return false;break;
    case 'recorrente':if(!l.recorrente)return false;break;
    case 'terminando':if(!(par&&p.x>=p.y))return false;break;
    case 'adiantado':if(!l.adiant)return false;break;
  }
  return true;
}
function filtrosAtivos(){
  var F=S.F,n=0;if(F.pessoa)n++;if(F.categoria)n++;if(F.tipo!=='todos')n++;if(F.busca)n++;return n;
}
function visao(doc){
  var F=S.F,porInst={},porPessoa={},total=0,lista=[];
  doc.lancamentos.forEach(function(l){
    if(!passa(l,F,true))return;
    var instOk=S.inst==='todas'||l.inst===S.inst;
    if(instOk)Object.keys(l.v||{}).forEach(function(pid){porPessoa[pid]=(porPessoa[pid]||0)+valorPessoa(l,pid);});
    if(F.pessoa&&valorPessoa(l,F.pessoa)<=0)return;
    var val=valorFiltrado(l,F);
    porInst[l.inst]=(porInst[l.inst]||0)+val;
    if(instOk){total+=val;lista.push(l);}
  });
  if(F.ordem==='valor')lista.sort(function(a,b){return valorFiltrado(b,F)-valorFiltrado(a,F);});
  else if(F.ordem==='nome')lista.sort(function(a,b){return a.compra.localeCompare(b.compra,'pt-BR');});
  else if(F.ordem==='restantes')lista.sort(function(a,b){return restantes(a)-restantes(b);});
  var todas=0;Object.keys(porInst).forEach(function(k){todas+=porInst[k];});
  return{porInst:porInst,porPessoa:porPessoa,total:total,lista:lista,todas:todas};
}

/* =========================================================
   Interface básica: toast, sheets, histórico do botão voltar
   ========================================================= */
function toast(msg,acao){
  var t=$('#toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(acao?'<button data-act="'+acao.act+'">'+esc(acao.label)+'</button>':'');
  t.hidden=false;clearTimeout(S.tt);S.tt=setTimeout(function(){t.hidden=true;},acao?8000:3600);
}
function abrirSheet(html,foco){
  clearTimeout(S.closeT);
  var s=$('#sheet');$('#sheet-body').innerHTML=html;s.hidden=false;
  if(!S.sheetPushed){try{history.pushState({sheet:1},'');S.sheetPushed=true;}catch(e){}}
  requestAnimationFrame(function(){s.classList.add('open');});
  if(foco)setTimeout(function(){var f=s.querySelector('input:not([type=checkbox]),textarea');if(f)f.focus({preventScroll:true});},60);
}
function fecharSheet(dePop){
  var s=$('#sheet');if(s.hidden)return;
  s.classList.remove('open');
  clearTimeout(S.closeT);
  S.closeT=setTimeout(function(){s.hidden=true;$('#sheet-body').innerHTML='';},180);
  S.edit=null;S.novoMes=null;S.import=null;
  if(S.sheetPushed){
    S.sheetPushed=false;
    if(!dePop){S.skipPop=true;try{history.back();}catch(e){S.skipPop=false;}}
  }
}
window.addEventListener('popstate',function(){
  if(S.skipPop){S.skipPop=false;return;}
  if(!$('#sheet').hidden){S.sheetPushed=false;fecharSheet(true);}
});

/* =========================================================
   Aba Mês
   ========================================================= */
function regua(p,raw){
  if(!p)return '<span class="parc">'+esc(raw||'—')+'</span>';
  if(p.y<=1)return '<span class="regua" aria-hidden="true"></span><span class="parc">'+p.x+'/'+p.y+'</span>';
  var h;
  if(p.y<=24){
    h='<span class="regua" role="img" aria-label="Parcela '+p.x+' de '+p.y+'">';

/* Fechamento: cada valor nasce das compras; o que for digitado substitui o automático. */
function fechCalc(doc,ov){
  var fech=doc.fechamento||{},usadas={},out={insts:[],mes:0,euAuto:0,temEu:!!pessoa('eu')};
  doc.lancamentos.forEach(function(l){usadas[l.inst]=1;});
  var ordem=CFG().pessoas.map(function(p){return p.id;});
  instsDoMes(doc).forEach(function(I){
    var f=fech[I.id]||{};
    var temF=Object.keys(f).some(function(k){return k!=='total'&&f[k]!=null;});
    if(!usadas[I.id]&&!temF)return;
    var ids=(I.pessoas&&I.pessoas.length?I.pessoas:pessoasAtivas().map(function(p){return p.id;})).slice();
    doc.lancamentos.forEach(function(l){if(l.inst===I.id)Object.keys(l.v||{}).forEach(function(id){if(ids.indexOf(id)<0)ids.push(id);});});
    Object.keys(f).forEach(function(k){if(k!=='total'&&f[k]!=null&&ids.indexOf(k)<0)ids.push(k);});
    ids=ids.filter(function(id){return pessoa(id);}).sort(function(a,b){return ordem.indexOf(a)-ordem.indexOf(b);});
    var linhas=ids.map(function(id){
      var auto=0;
      doc.lancamentos.forEach(function(l){if(l.inst===I.id)auto+=valorPessoa(l,id);});
      auto=Math.round(auto*100)/100;
      var dig=ov?ov(I.id,id):(f[id]!=null?f[id]:null);
      var valor=dig!=null?dig:auto;
      if(id==='eu')out.euAuto+=valor;
      return{id:id,auto:auto,dig:dig,valor:valor};
    });
    var total=Math.round(linhas.reduce(function(s,r){return s+r.valor;},0)*100)/100;
    out.insts.push({I:I,linhas:linhas,total:total});out.mes+=total;
  });
  out.mes=Math.round(out.mes*100)/100;out.euAuto=Math.round(out.euAuto*100)/100;
  return out;
}

/* ---------- novo mês ---------- */
/* ---------- parcelas nos meses seguintes ----------
   Uma compra parcelada vira uma "cadeia": a mesma compra em cada mês, com a parcela avançando.
   As parcelas de uma mesma compra compartilham o campo "grupo". */
function parcelado(l){var p=parseParcela(l.parcela);return !!(p&&p.y>1&&p.x<p.y&&!l.recorrente);}
function novoW(){return{docs:{}};}
function docTrab(W,k){
  if(W.docs[k])return W.docs[k];
  if(S.D.meses[k]){W.docs[k]=clone(S.D.meses[k]);return W.docs[k];}
  return null;
}
function jaTem(doc,l,rotulo){
  var nc=norm(l.compra),pl=parseParcela(rotulo);
  return doc.lancamentos.some(function(x){
    var q=parseParcela(x.parcela);
    return x.inst===l.inst&&norm(x.compra)===nc&&q&&pl&&q.y===pl.y&&q.x===pl.x;
  });
}
function contarIrmaos(k,g){
  var n=0;
  Object.keys(S.D.meses).forEach(function(kx){if(kx<=k)return;S.D.meses[kx].lancamentos.forEach(function(l){if(l.grupo===g)n++;});});
  return n;
}
/* Faz os meses que já existem refletirem a compra: lança (ou renumera) as parcelas e tira as que sobram.
   Meses que ainda não existem não são criados; eles trazem a compra quando você os cria.
   Parcelas adiantadas encurtam a cadeia: ela termina antes, sem buracos. */
function alinharCadeia(W,k0,base){
  var r={adicionados:0,faltam:0,meses:[],removidos:0},p=parseParcela(base.parcela);
  if(!p||!base.grupo||base.recorrente)return r;
  var q=base.adiant?num0(base.adiant.qtd):0,m=Math.max(0,p.y-p.x-q);
  for(var j=1;j<=m;j++){
    var kj=somaMeses(k0,j),doc=docTrab(W,kj);
    if(!doc){r.faltam++;continue;}   /* mês que ainda não existe: ele traz a compra quando você criá-lo */
    var rotulo=(p.x+q+j)+'/'+p.y;
    var irmao=doc.lancamentos.find(function(l){return l.grupo===base.grupo;});
    if(irmao){if(irmao.parcela!==rotulo)irmao.parcela=rotulo;}
    else if(!jaTem(doc,base,rotulo)){
      var c=clone(base);c.id=novoId();c.parcela=rotulo;c.adiant=null;doc.lancamentos.push(c);r.adicionados++;r.meses.push(kj);
    }
  }
  var fim=somaMeses(k0,m);
  Object.keys(S.D.meses).concat(Object.keys(W.docs)).forEach(function(kx){
    if(kx<=fim||kx<=k0)return;
    var src=W.docs[kx]||S.D.meses[kx];
    if(!src||!src.lancamentos.some(function(l){return l.grupo===base.grupo;}))return;
    var d=docTrab(W,kx),n=d.lancamentos.length;
    d.lancamentos=d.lancamentos.filter(function(l){return l.grupo!==base.grupo;});
    r.removidos+=n-d.lancamentos.length;
  });
  return r;
}
function aplicarLote(W,msg){
  var antes={},put=[];
  Object.keys(W.docs).forEach(function(k){
    var novo=W.docs[k],velho=S.D.meses[k];
    if(velho&&JSON.stringify(velho)===JSON.stringify(novo))return;
    antes[k]=velho?clone(velho):null;S.D.meses[k]=novo;put.push(['mes:'+k,novo]);
  });
  if(!put.length)return;
  S.desfazer={antes:antes};
  persistLote(put,[]);
  render();
  if(msg)toast(msg,{act:'undo-lote',label:'Desfazer'});
}

    else{S.D.meses[k]=d.antes[k];put.push(['mes:'+k,d.antes[k]]);}

function chaveCadeia(l){var p=parseParcela(l.parcela);return l.grupo?('g:'+l.grupo):('k:'+l.inst+'|'+norm(l.compra)+'|'+(p?p.y:'?'));}
/* Meses que dá para criar: os que faltam entre o primeiro e o último e o mês seguinte ao último. */
function mesesParaCriar(){
  var keys=mesKeys();if(!keys.length)return[];
  var ult=keys[keys.length-1],out=[],k=keys[0];
  for(var g=0;g<240&&k<ult;g++){if(!S.D.meses[k])out.push(k);k=somaMeses(k,1);}
  out.push(somaMeses(ult,1));
  return out;
}
/* O que o mês T deve trazer: o que continua do mês anterior mais perto (parcelas avançam, adiantamentos contam)
   e as compras parceladas já lançadas em meses seguintes que começaram em T ou antes. */
function proposta(T){
  var keys=mesKeys(),antes=keys.filter(function(k){return k<T;}),depois=keys.filter(function(k){return k>T;}),out=[],vistos={};
  if(antes.length){
    var B=antes[antes.length-1],d=difMeses(B,T);
    S.D.meses[B].lancamentos.forEach(function(l){
      var p=parseParcela(l.parcela),novo=clone(l),st,extra='',qtd=l.adiant?num0(l.adiant.qtd):0;
      novo.adiant=null;
      if(l.recorrente){st='continua';}
      else if(p&&p.y>1){
        var nx=p.x+d+qtd;
        if(nx<=p.y){novo.parcela=nx+'/'+p.y;st='continua';}
        else{st='concluida';extra=(qtd&&p.x+qtd>=p.y)?'quitada com adiantamento':'terminou em '+l.parcela;}
      }
      else if(p){st='concluida';extra='terminou em '+l.parcela;}
      else{st='manual';extra='parcela sem formato';}
      vistos[chaveCadeia(l)]=1;
      out.push({novo:novo,st:st,antes:l.parcela,depois:novo.parcela,extra:extra});
    });
  }
  if(depois.length){
    var L=depois[0],e=difMeses(T,L);
    S.D.meses[L].lancamentos.forEach(function(l){
      var p=parseParcela(l.parcela);
      if(l.recorrente||!p||p.y<=1||p.x-e<1||vistos[chaveCadeia(l)])return;
      var novo=clone(l);novo.adiant=null;novo.parcela=(p.x-e)+'/'+p.y;
      out.push({novo:novo,st:'continua',antes:null,depois:novo.parcela,extra:'já lançada em '+mesCurto(L)});
    });
  }
  return out;
}

    (sec||'<p class="hint">Nenhuma compra com parcelas para este mês. Ele será criado vazio.</p>')+
    '<div class="acoes" style="margin-top:14px"><span class="sp"></span><button class="btn" data-act="sheet-close">Cancelar</button><button class="btn primary" data-act="novo-mes-criar">Criar mês</button></div>',false);

/* =========================================================
   Aba Histórico
   ========================================================= */
function rangeKeys(){
  var keys=mesKeys(),H=S.H;
  return keys.filter(function(k){return(!H.de||k>=H.de)&&(!H.ate||k<=H.ate);});
}
function aggMes(doc){
  var H=S.H,total=0,porInst={},porPessoa={};
  doc.lancamentos.forEach(function(l){
    if(H.inst&&l.inst!==H.inst)return;
    if(H.pessoa&&valorPessoa(l,H.pessoa)<=0)return;
    var val=H.pessoa?valorPessoa(l,H.pessoa):totalLanc(l);
    total+=val;porInst[l.inst]=(porInst[l.inst]||0)+val;
    Object.keys(l.v||{}).forEach(function(pid){
      if(H.pessoa&&pid!==H.pessoa)return;
      porPessoa[pid]=(porPessoa[pid]||0)+valorPessoa(l,pid);
    });
  });
  return{total:total,porInst:porInst,porPessoa:porPessoa};
}
function grafico(keys,A,insts){
  var n=keys.length,W=n>13?16+n*26:360,H=176,pl=8,pr=8,pt=20,pb=26;
  var max=Math.max.apply(null,keys.map(function(k){return A[k].total;}).concat([1]));
  var step=(W-pl-pr)/n,bw=Math.min(28,step*.64),ch=H-pt-pb,g='';
  keys.forEach(function(k,i){
    var t=A[k],x=pl+step*i+(step-bw)/2,l=lab(k),sel=k===S.mesSel,y=H-pb,bars='';
    insts.forEach(function(I){
      var h=(t.porInst[I.id]||0)/max*ch;if(h<=0)return;
      y-=h;bars+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="2" fill="'+I.cor+'"/>';
    });
    g+='<g data-act="bar" data-k="'+k+'" tabindex="0" role="button" aria-label="'+l.nome+': '+brl(t.total)+'">'+
      '<rect x="'+(pl+step*i)+'" y="0" width="'+step+'" height="'+H+'" fill="transparent"/>'+bars+
      '<text x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle"'+(sel?' class="sel"':'')+'>'+(t.total/1000).toFixed(1).replace('.',',')+'k</text>'+
      '<text x="'+(x+bw/2)+'" y="'+(H-9)+'" text-anchor="middle"'+(sel?' class="sel"':'')+'>'+l.abr+'</text></g>';
  });
  return '<div class="graf-wrap"><svg class="graf" viewBox="0 0 '+W+' '+H+'"'+(n>13?' style="width:'+W+'px"':'')+' role="group" aria-label="Total por mês">'+g+'</svg></div>';
}
function difMeses(a,b){var x=lab(a),y=lab(b);return(y.y-x.y)*12+(y.m-x.m);}
/* Parcelas que ainda vão vencer depois do mês atual: lê os meses já lançados e, depois do último,
   projeta o que ainda falta de cada compra. */
function parcelasPorVir(){
  var all=mesKeys(),h=hojeKey(),H=S.H;
  var base=all.indexOf(h)>-1?h:(all.filter(function(k){return k<=h;}).pop()||all[all.length-1]);
  var ult=all[all.length-1],abertas={},cadeias=[];
  all.filter(function(k){return k>=base;}).forEach(function(k){
    var usados={};
    S.D.meses[k].lancamentos.forEach(function(l){
      var p=parseParcela(l.parcela);if(!p||p.y<=1||l.recorrente)return;
      if(H.inst&&l.inst!==H.inst)return;
      var v=H.pessoa?num0(l.v&&l.v[H.pessoa]):somaV(l);if(v<=0)return;
      var chave=l.grupo?('g:'+l.grupo):('k:'+l.inst+'|'+norm(l.compra)+'|'+p.y);
      var lista=abertas[chave]||(abertas[chave]=[]),idx=-1;
      for(var i=0;i<lista.length;i++){if(lista[i].ult.k<k&&!usados[chave+'#'+i]){idx=i;break;}}
      var it={k:k,x:p.x,q:l.adiant?num0(l.adiant.qtd):0,v:v};
      if(idx<0){lista.push({nome:l.compra,inst:l.inst,y:p.y,itens:[it],ult:it});cadeias.push(lista[lista.length-1]);usados[chave+'#'+(lista.length-1)]=1;}
      else{lista[idx].itens.push(it);lista[idx].ult=it;lista[idx].nome=l.compra;usados[chave+'#'+idx]=1;}
    });
  });
  var porMes={},rows=[];
  cadeias.forEach(function(c){
    var depois=c.itens.filter(function(i){return i.k>base;}),u=c.ult;
    var cauda=(u.k===ult)?Math.max(0,c.y-u.x-u.q):0,falta=depois.length+cauda;
    if(falta<=0)return;
    depois.forEach(function(i){porMes[i.k]=(porMes[i.k]||0)+i.v;});
    for(var j=1;j<=cauda;j++){var kj=somaMeses(u.k,j);porMes[kj]=(porMes[kj]||0)+u.v;}
    var prim=c.itens[0];
    rows.push({nome:c.nome,inst:(inst(c.inst)||{nome:'?'}).nome,y:c.y,x:prim.x,noBase:prim.k===base,inicio:prim.k,falta:falta,
      valor:(depois[0]||u).v,restam:depois.reduce(function(s,i){return s+i.v;},0)+cauda*u.v,fim:somaMeses(u.k,cauda),ad:u.q});
  });
  rows.sort(function(a,b){return a.fim.localeCompare(b.fim)||b.valor-a.valor;});
  var chaves=Object.keys(porMes).sort(),serie=[];
  if(chaves.length){
    var n=Math.min(12,difMeses(base,chaves[chaves.length-1]));
    for(var j=1;j<=n;j++){var kk=somaMeses(base,j);serie.push({k:kk,v:porMes[kk]||0});}
  }
  return{base:base,rows:rows,serie:serie};
}
function vResumo(){

  var all=mesKeys();
  if(!all.length)return '<div class="aviso"><p>Crie um mês na aba Mês para ver o histórico aqui.</p></div>';
  S.mesSel=escolher(all,S.mesSel);
  var H=S.H,keys=rangeKeys();
  var selMes=function(id,val){return '<select id="'+id+'" data-hsel="'+id+'">'+all.map(function(k){return '<option value="'+k+'"'+(k===val?' selected':'')+'>'+lab(k).nome+' '+lab(k).y+'</option>';}).join('')+'</select>';};
  var chip=function(act,attrs,txt,on){return '<button class="chip sm" data-act="'+act+'" '+attrs+' aria-pressed="'+on+'">'+txt+'</button>';};
  var filtros='<div class="card hfiltros"><h3>Filtros</h3><div class="rot">Pessoa</div><div class="chipset">'+chip('h-pessoa','data-v=""','Todas',!H.pessoa)+
    pessoasVisiveis().map(function(p){return chip('h-pessoa','data-v="'+esc(p.id)+'"','<span class="d" style="background:'+p.cor+'"></span>'+esc(p.nome),H.pessoa===p.id);}).join('')+'</div>'+
    '<div class="rot">Instituição</div><div class="chipset">'+chip('h-inst','data-v=""','Todas',!H.inst)+
    CFG().instituicoes.filter(function(i){return i.ativa!==false||usoInst(i.id)>0;}).map(function(i){return chip('h-inst','data-v="'+esc(i.id)+'"','<span class="d" style="background:'+i.cor+'"></span>'+esc(i.nome),H.inst===i.id);}).join('')+'</div>'+
    '<div class="rot">Período</div><div class="hsel">'+selMes('h-de',H.de||all[0])+selMes('h-ate',H.ate||all[all.length-1])+'</div>'+
    '<div class="rot">Buscar em todos os meses</div><input type="search" id="hbusca" placeholder="Nome da compra ou categoria" value="'+esc(H.busca)+'" autocomplete="off"></div>';
  if(!keys.length)return filtros+'<div class="aviso"><p>Nenhum mês no período escolhido.</p></div>';

  var A={},acc={total:0,porInst:{},porPessoa:{}},instUsadas={},pessUsadas={};
  keys.forEach(function(k){
    var a=aggMes(S.D.meses[k]);A[k]=a;acc.total+=a.total;
    Object.keys(a.porInst).forEach(function(i){acc.porInst[i]=(acc.porInst[i]||0)+a.porInst[i];instUsadas[i]=1;});
    Object.keys(a.porPessoa).forEach(function(p){acc.porPessoa[p]=(acc.porPessoa[p]||0)+a.porPessoa[p];pessUsadas[p]=1;});
  });
  var insts=CFG().instituicoes.filter(function(i){return instUsadas[i.id];});
  var pess=CFG().pessoas.filter(function(p){return pessUsadas[p.id];});
  var cab='<tr><th>Mês</th><th>Total</th>'+insts.map(function(i){return '<th>'+esc(i.nome)+'</th>';}).join('')+pess.map(function(p){return '<th>'+esc(p.nome)+'</th>';}).join('')+'</tr>';
  var linhas=keys.map(function(k){
    var a=A[k];
    return '<tr><td>'+mesCurto(k)+'</td><td class="t">'+brlc(a.total)+'</td>'+insts.map(function(i){return '<td>'+brlc(a.porInst[i.id]||0)+'</td>';}).join('')+pess.map(function(p){return '<td>'+brlc(a.porPessoa[p.id]||0)+'</td>';}).join('')+'</tr>';
  }).join('');
  var rodape='<tr><td>Soma</td><td>'+brlc(acc.total)+'</td>'+insts.map(function(i){return '<td>'+brlc(acc.porInst[i.id]||0)+'</td>';}).join('')+pess.map(function(p){return '<td>'+brlc(acc.porPessoa[p.id]||0)+'</td>';}).join('')+'</tr>';
  var leg=insts.map(function(i){return '<span><i style="background:'+i.cor+'"></i>'+esc(i.nome)+'</span>';}).join('');

  var busca='';
  if(H.busca){
    var res=[],soma=0;
    keys.forEach(function(k){
      S.D.meses[k].lancamentos.forEach(function(l){
        if(H.inst&&l.inst!==H.inst)return;
        if(norm(l.compra+' '+(l.categoria||'')+' '+(l.nota||'')).indexOf(norm(H.busca))<0)return;
        var v=H.pessoa?valorPessoa(l,H.pessoa):totalLanc(l);if(H.pessoa&&v<=0)return;
        soma+=v;res.push({k:k,l:l,v:v});
      });
    });
    busca='<div class="card"><h3>Resultado da busca</h3><p class="sub">'+res.length+' lançamento'+(res.length===1?'':'s')+' · '+brl(soma)+' no período</p>'+
      (res.slice(0,200).map(function(r){
        var I=inst(r.l.inst)||{nome:'?'};
        return '<div class="res"><div><b>'+esc(r.l.compra)+'</b><div class="r2">'+mesCurto(r.k)+' · '+esc(I.nome)+' · '+esc(r.l.parcela||'')+'</div></div><b>'+brl(r.v)+'</b></div>';
      }).join('')||'<p class="hint">Nada encontrado.</p>')+'</div>';
  }

  var AN=parcelasPorVir();
  var mx=Math.max.apply(null,AN.serie.map(function(s){return s.v;}).concat([1]));
  var venc=AN.serie.map(function(s){return '<div class="venc"><span class="m">'+mesCurto(s.k)+'</span><span class="b"><i style="width:'+(s.v/mx*100)+'%"></i></span><span class="v">'+brlc(s.v)+'</span></div>';}).join('');
  var lista=AN.rows.map(function(r){
    var txt=r.noBase?(r.x+'/'+r.y+(r.ad?' (adiantou '+r.ad+')':'')+' · faltam '+r.falta):('começa em '+mesCurto(r.inicio)+' ('+r.x+'/'+r.y+') · '+r.falta+' parcela'+(r.falta>1?'s':''));
    return '<div class="and"><div class="a1"><span>'+esc(r.nome)+'</span><span>'+brlc(r.valor)+'/mês</span></div><div class="a2">'+esc(r.inst)+' · '+txt+' · termina em '+mesCurto(r.fim)+' · '+(r.noBase?'restam ':'total ')+brlc(r.restam)+'</div></div>';
  }).join('');
  return filtros+busca+
    '<div class="card"><h3>Total por mês</h3><p class="sub">Toque em uma barra para abrir o mês.</p>'+grafico(keys,A,insts)+'<div class="legenda">'+leg+'</div></div>'+
    '<div class="card"><h3>Todos os meses</h3><p class="sub">Soma do período escolhido.</p><div class="tbl"><table><thead>'+cab+'</thead><tbody>'+linhas+'</tbody><tfoot>'+rodape+'</tfoot></table></div></div>'+
    (AN.rows.length?'<div class="card"><h3>Parcelas por vir</h3><p class="sub">A partir de '+lab(AN.base).nome+'. Só entram parcelas já lançadas, sem compras novas nem itens que repetem todo mês.</p>'+venc+'<div style="margin-top:12px">'+lista+'</div></div>':'');
}

function calcPrev(doc){
  var carry=0;
  return doc.blocos.map(function(b){
    var ent=b.entradas.reduce(function(s,e){return s+num0(e.valor);},0);
    var sai=b.saidas.reduce(function(s,e){return s+num0(e.valor);},0);
    var ini=b.carregaSaldo?carry:0,resta=ini+ent-sai;carry=resta;
    return{ini:ini,ent:ent,sai:sai,resta:resta};
  });
}
function vPrev(){
  if(!S.pronto)return '<div class="skel"></div>';
  var keys=prevKeys();
  if(!keys.length)return '<div class="vazio"><h2>Sem previsão ainda</h2><p>Planeje o mês por datas de entrada: o que entra, o que sai e quanto sobra.</p><button class="btn primary" data-act="prev-novo">Criar previsão de '+lab(hojeKey()).nome+'</button></div>';
  S.prevSel=escolher(keys,S.prevSel);
  var k=S.prevSel,doc=S.D.prevs[k],C=calcPrev(doc);
  var chips=keys.map(function(x){return '<button class="chip" data-act="prev-sel" data-k="'+x+'" aria-pressed="'+(x===k)+'">'+lab(x).abr+'</button>';}).join('')+'<button class="chip add" data-act="prev-novo">+ mês</button>';
  var blocos=doc.blocos.map(function(b,bi){
    var c=C[bi];
    var lin=function(arr,t){return arr.map(function(e){
      return '<button class="lin '+(t==='entradas'?'ent':'sai')+'" data-act="linha" data-b="'+esc(b.id)+'" data-t="'+t+'" data-id="'+esc(e.id)+'"><span>'+esc(e.nome)+(e.nota?'<small>'+esc(e.nota)+'</small>':'')+'</span><span class="v">'+(t==='entradas'?'+ ':'')+brl(num0(e.valor))+'</span></button>';
    }).join('');};
    return '<section class="bloco"><header><button data-act="bloco-editar" data-b="'+esc(b.id)+'" aria-label="Editar '+esc(b.titulo)+'"><h3>'+esc(b.titulo)+'</h3></button><span class="resta'+(c.resta<0?' neg':'')+'">Resta '+brl(c.resta)+'</span></header>'+
      (b.carregaSaldo?'<div class="lin saldo"><span>Sobra do bloco anterior</span><span class="v">'+brl(c.ini)+'</span></div>':'')+
      lin(b.entradas,'entradas')+lin(b.saidas,'saidas')+
      '<div class="add"><button data-act="linha-nova" data-b="'+esc(b.id)+'" data-t="entradas">+ Entrada</button><button data-act="linha-nova" data-b="'+esc(b.id)+'" data-t="saidas">+ Saída</button></div></section>';
  }).join('');
  return '<div class="chips">'+chips+'</div><div class="mes-head"><h2>'+lab(k).nome+'<small>'+lab(k).y+'</small></h2></div>'+blocos+
    '<button class="btn block" data-act="bloco-novo">+ Novo bloco de datas</button>'+
    '<button class="btn danger block" style="margin-top:16px" data-act="prev-excluir">Excluir este mês</button>';
}

}
async function excluirPrev(){
  var E=S.edit;if(!E||E.tipo!=='excluir-prev')return;
  var k=E.k,doc=S.D.prevs[k];if(!doc)return;
  fecharSheet();
  try{await criarSnap('antes de excluir previsão de '+lab(k).nome+' '+lab(k).y);}catch(e){}
  var keys=prevKeys(),i=keys.indexOf(k),viz=keys[i-1]||keys[i+1]||null;
  delete S.D.prevs[k];S.prevExcluida={k:k,doc:doc};S.prevSel=viz;
  await persistLote([],['prev:'+k]);
  render();toast('Previsão excluída.',{act:'undo-prev',label:'Desfazer'});
}
function desfazerPrev(){
  var d=S.prevExcluida;if(!d||S.D.prevs[d.k])return;
  S.D.prevs[d.k]=d.doc;S.prevExcluida=null;S.prevSel=d.k;S.scrollChip=true;$('#toast').hidden=true;
  persistLote([['prev:'+d.k,d.doc]],[]);render();
}
function acharBloco(doc,bid){return doc.blocos.find(function(b){return b.id===bid;});}

function salvarLinha(){
  var E=S.edit;if(!E||E.tipo!=='linha')return;
  var k=S.prevSel,doc=clone(S.D.prevs[k]),b=acharBloco(doc,E.bid);
  var nome=$('#l-nome').value.trim();if(!nome){toast('Informe um nome.');$('#l-nome').focus();return;}
  var v=parseNum($('#l-valor').value);if(Number.isNaN(v)||v==null){toast('Informe um valor válido, como 150 ou 150,50.');$('#l-valor').focus();return;}
  var nota=$('#l-nota').value.trim();
  var base=E.id?b[E.t].find(function(x){return x.id===E.id;}):null;
  var linha=Object.assign({},base||{},{id:E.id||novoId(),nome:nome,valor:v});
  if(nota)linha.nota=nota;else delete linha.nota;
  if(base)b[E.t][b[E.t].indexOf(base)]=linha;else b[E.t].push(linha);
  fecharSheet();salvarPrev(k,doc);
}
function excluirLinha(){
  var E=S.edit;if(!E||!E.id)return;
  var k=S.prevSel,doc=clone(S.D.prevs[k]),b=acharBloco(doc,E.bid);
  b[E.t]=b[E.t].filter(function(x){return x.id!==E.id;});

function salvarBloco(){
  var E=S.edit;if(!E||E.tipo!=='bloco')return;
  var k=S.prevSel,doc=clone(S.D.prevs[k]);

function excluirBloco(){
  var E=S.edit;if(!E||!E.bid)return;
  var k=S.prevSel,doc=clone(S.D.prevs[k]);
  doc.blocos=doc.blocos.filter(function(b){return b.id!==E.bid;});
  fecharSheet();salvarPrev(k,doc);
}
function novaPrev(){
  var keys=prevKeys(),k,doc;
  if(keys.length){
    var ult=S.D.prevs[keys[keys.length-1]];k=somaMeses(keys[keys.length-1],1);
    doc=clone(ult);delete doc.celulas;doc.chave=k;doc.titulo=lab(k).nome;
    doc.blocos.forEach(function(b){b.id=novoId();b.entradas.forEach(function(e){e.id=novoId();});b.saidas.forEach(function(e){e.id=novoId();});});
  }else{
    k=hojeKey();doc={tipo:'previsao',chave:k,titulo:lab(k).nome,blocos:[{id:novoId(),titulo:'Dia 05',carregaSaldo:false,entradas:[],saidas:[]}]};
  }
  S.prevSel=k;S.scrollChip=true;salvarPrev(k,doc);
}

function swatchesHtml(cor){
  return '<div class="swatches" id="swatches">'+PALETA.map(function(c){return '<button class="sw" style="background:'+c+'" data-act="cor" data-cor="'+c+'" aria-label="Cor '+c+'" aria-pressed="'+(c.toLowerCase()===String(cor).toLowerCase())+'"></button>';}).join('')+'</div>';
}
function abrirPessoa(id){
  var novo=!id,cfg=CFG();
  var P=novo?{nome:'',cor:PALETA[cfg.pessoas.length%PALETA.length],ativa:true}:pessoa(id);
  if(!P)return;

/* ---------- backup e importação ---------- */
async function entregarArquivo(nome,texto,mime,direto){
  var blob=new Blob([texto],{type:mime});
  if(!direto){
    try{
      var f=new File([blob],nome,{type:mime});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nome});return true;}
    }catch(e){if(e&&e.name==='AbortError')return false;}
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
  return true;
}
async function backup(direto){
  var hoje=new Date().toISOString().slice(0,10);
  var ok=await entregarArquivo('finanapp-backup-'+hoje+'.json',JSON.stringify(exportObj(),null,1),'application/json',direto);
  if(ok){S.meta.ultimoBackup=Date.now();salvarMeta();toast('Backup gerado.');render();}
}
function csvCampo(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}
async function exportarCsv(){
  var pess=CFG().pessoas.filter(function(p){return usoPessoa(p.id)>0;});
  var linhas=[['Mês','Instituição','Compra','Categoria','Parcela'].concat(pess.map(function(p){return p.nome;})).concat(['Adiantamento','Total','Repete todo mês','Observação'])];
  mesKeys().forEach(function(k){

    S.D.meses[k].lancamentos.forEach(function(l){

      linhas.push([l0.nome+' '+l0.y,I.nome,l.compra,l.categoria||'',l.parcela||''].concat(pess.map(function(p){return l.v&&l.v[p.id]!=null?f(l.v[p.id]):'';})).concat([l.adiant?f(l.adiant.valor):'',f(totalLanc(l)),l.recorrente?'sim':'',l.nota||'']));
    });
  });
  var hoje=new Date().toISOString().slice(0,10);
  var ok=await entregarArquivo('finanapp-'+hoje+'.csv','\ufeff'+linhas.map(function(r){return r.map(csvCampo).join(';');}).join('\r\n'),'text/csv',false);
  if(ok)toast('Arquivo gerado.');

function migrarV1(obj){
  var docs=obj.documentos||{};
  var cfg={versao:2,
    pessoas:[{id:'mae',nome:'Mãe',cor:'#D6336C',ativa:true},{id:'pai',nome:'Pai',cor:'#198F83',ativa:true},{id:'eu',nome:'Eu',cor:'#C27803',ativa:true},{id:'clara',nome:'Clara',cor:'#3C8D2F',ativa:true}],
    instituicoes:[{id:'nubank',nome:'Nubank',cor:'#8A05BE',tipo:'cartao',pessoas:['mae','pai','eu'],ativa:true},{id:'mp',nome:'Mercado Pago',cor:'#0B7FBF',tipo:'cartao',pessoas:['eu','clara'],ativa:true}]};
  var nomeId={'Mãe':'mae','Pai':'pai','Eu':'eu','Clara':'clara'};
  var mapa=function(o){var r={};Object.keys(o||{}).forEach(function(n){if(o[n]!=null)r[nomeId[n]||slug(n)]=o[n];});return r;};
  var meses={},prevs={};
  Object.keys(docs).forEach(function(id){
    var d=docs[id];
    if(id.indexOf('mes-')===0){
      var k=id.slice(4),lanc=[],fech={};
      Object.keys(d.cartoes||{}).forEach(function(cid){
        var c=d.cartoes[cid];
        (c.itens||[]).forEach(function(it){
          var l={id:it.id||novoId(),inst:cid,compra:it.compra,parcela:it.parcela,v:mapa(it.v),recorrente:!!it.recorrente,adiant:null};
          if(it.nota)l.nota=it.nota;
          lanc.push(l);
        });
        var f=c.fechamento||{},fm=mapa(f);if(f.total!=null)fm.total=f.total;
        if(Object.keys(fm).length)fech[cid]=fm;
      });
      meses[k]={chave:k,lancamentos:lanc,fechamento:fech,euAPagar:d.euAPagar||{valor:null},notas:d.notas||'',
        celulas:d.celulas||[]};
    }else if(id.indexOf('prev-')===0){prevs[id.slice(5)]=d;}
  });
  return{config:cfg,meses:meses,prevs:prevs};
}
function limparNota(n){
  if(!n||!/planilha|fórmula|formula/i.test(n))return n;
  var m=/=\s*([0-9+\-*\/.,()\s]+)$/.exec(n);
  return m?('Soma: '+m[1].trim().replace(/\s*\+\s*/g,' + ')):null;
}
function limparNotasLegado(D){
  var mudou=[];
  Object.keys(D.meses||{}).forEach(function(k){
    var alt=false;
    (D.meses[k].lancamentos||[]).forEach(function(l){
      if(!l.nota)return;var nn=limparNota(l.nota);
      if(nn!==l.nota){if(nn)l.nota=nn;else delete l.nota;alt=true;}
    });
    if(alt)mudou.push('mes:'+k);
  });
  Object.keys(D.prevs||{}).forEach(function(k){
    var alt=false;
    (D.prevs[k].blocos||[]).forEach(function(b){
      ['entradas','saidas'].forEach(function(t){(b[t]||[]).forEach(function(e){
        if(!e.nota)return;var nn=limparNota(e.nota);
        if(nn!==e.nota){if(nn)e.nota=nn;else delete e.nota;alt=true;}
      });});
    });
    if(alt)mudou.push('prev:'+k);
  });
  return mudou;
}
function lerObjeto(obj){
  var d=null;
  if(obj&&obj.versao===2&&obj.config&&obj.meses)d={config:obj.config,meses:obj.meses,prevs:obj.prevs||{}};
  else if(obj&&obj.documentos)d=migrarV1(obj);
  if(d)limparNotasLegado(d);
  return d;
}
function lerArquivo(file){
  var r=new FileReader();
  r.onload=function(){
    var obj;try{obj=JSON.parse(r.result);}catch(e){toast('Esse arquivo não é um backup válido.');return;}
    var d=lerObjeto(obj);
    if(!d||!Object.keys(d.meses).length&&!Object.keys(d.prevs).length){toast('Não encontrei meses nesse arquivo.');return;}
    S.import=d;
    var nm=Object.keys(d.meses).length,np=Object.keys(d.prevs).length,compras=Object.keys(d.meses).reduce(function(s,k){return s+d.meses[k].lancamentos.length;},0);
    abrirSheet('<h2>Importar histórico</h2><p class="sub">O arquivo tem '+nm+' mes'+(nm===1?'':'es')+', '+compras+' lançamentos e '+np+' '+(np===1?'previsão':'previsões')+'.</p>'+
      (temDados()?'<p class="hint" style="margin:0 0 12px">Antes de qualquer mudança, o app guarda uma cópia automática do que existe hoje.</p>':'')+
      '<div style="display:grid;gap:8px"><button class="btn primary block" data-act="import-substituir">Substituir tudo pelo arquivo</button>'+
      '<button class="btn block" data-act="import-mesclar">Mesclar: só acrescentar o que falta</button><button class="btn block" data-act="sheet-close">Cancelar</button></div>'+
      '<p class="hint">Substituir apaga o que está no app agora. Mesclar mantém seus meses e adiciona os que não existem.</p>',false);
  };
  r.readAsText(file);
}
async function aplicarImport(modo){
  var d=S.import;if(!d)return;
  try{
    await criarSnap('antes de importar');
    var entradas=[],novo;
    if(modo==='substituir'){
      novo={config:d.config,meses:d.meses,prevs:d.prevs};
      entradas.push(['config',novo.config]);
      Object.keys(novo.meses).forEach(function(k){entradas.push(['mes:'+k,novo.meses[k]]);});
      Object.keys(novo.prevs).forEach(function(k){entradas.push(['prev:'+k,novo.prevs[k]]);});
      entradas.push(['meta',S.meta]);
      await gravarLote(entradas,true);
    }else{
      var cfg=clone(CFG());
      d.config.pessoas.forEach(function(p){if(!cfg.pessoas.some(function(x){return x.id===p.id;}))cfg.pessoas.push(p);});
      d.config.instituicoes.forEach(function(i){
        var ex=cfg.instituicoes.find(function(x){return x.id===i.id;});
        if(!ex)cfg.instituicoes.push(i);
        else(i.pessoas||[]).forEach(function(pid){if(ex.pessoas&&ex.pessoas.length&&ex.pessoas.indexOf(pid)<0)ex.pessoas.push(pid);});
      });
      novo={config:cfg,meses:clone(S.D.meses),prevs:clone(S.D.prevs)};
      entradas.push(['config',cfg]);
      Object.keys(d.meses).forEach(function(k){if(!novo.meses[k]){novo.meses[k]=d.meses[k];entradas.push(['mes:'+k,d.meses[k]]);}});
      Object.keys(d.prevs).forEach(function(k){if(!novo.prevs[k]){novo.prevs[k]=d.prevs[k];entradas.push(['prev:'+k,d.prevs[k]]);}});
      await gravarLote(entradas,false);
    }
    S.D=novo;S.mesSel=null;S.mesManualDia=null;S.prevSel=null;S.inst='todas';S.F.pessoa=null;S.H={pessoa:null,inst:null,de:null,ate:null,busca:''};
    fecharSheet();S.aba='mes';S.scrollChip=true;setStatus('salvo');render();
    toast(modo==='substituir'?'Histórico importado.':'Dados acrescentados.');
  }catch(e){toast('A importação falhou. Nada foi alterado.');}
}

/* =========================================================
   Bloqueio do app (PIN e digital/rosto)
   É uma barreira de uso: impede que outra pessoa abra o app.
   O PIN nunca é guardado; só um hash com sal (PBKDF2).
   ========================================================= */
var ENC=(typeof TextEncoder!=='undefined')?new TextEncoder():null;
var ALFA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var AUTO_OPCOES=[[0,'Imediatamente'],[60,'Após 1 minuto'],[300,'Após 5 minutos'],[900,'Após 15 minutos']];
var LK={modo:'unlock',n:6,pin:'',primeiro:null,cb:null,cancelavel:false,ocupado:false,timer:null};
var ICO_BIO='<svg viewBox="0 0 24 24"><path d="M12 11a2 2 0 0 0-2 2c0 1.5-.3 3-1 4.5"/><path d="M12 7a6 6 0 0 0-6 6c0 1.2-.2 2.4-.6 3.5"/><path d="M16 14c0 2-.4 3.8-1.2 5.5"/><path d="M12 3a10 10 0 0 0-10 10"/><path d="M12 3a10 10 0 0 1 10 10c0 1.3-.1 2.5-.4 3.7"/><path d="M12 11a2 2 0 0 1 2 2c0 .7 0 1.3-.1 2"/></svg>';
var ICO_APAGAR='<svg viewBox="0 0 24 24"><path d="M20 5H9l-6 7 6 7h11a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M15 9l-4 6M11 9l4 6"/></svg>';

function cripto(){return !!(window.crypto&&window.crypto.subtle&&window.crypto.getRandomValues&&ENC);}
function lockCfg(){return(S.meta&&S.meta.bloqueio&&S.meta.bloqueio.ativo)?S.meta.bloqueio:null;}
function lockAtivo(){return !!lockCfg();}
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function b64u(buf){return b64(buf).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return unb64(s);}
function aleatorio(n){return crypto.getRandomValues(new Uint8Array(n));}
async function derivar(segredo,saltB64,iter){
  var chave=await crypto.subtle.importKey('raw',ENC.encode(segredo),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(saltB64),iterations:iter,hash:'SHA-256'},chave,256);
  return b64(bits);
}
async function novoSegredo(segredo){var s=b64(aleatorio(16)),i=150000;return{s:s,i:i,h:await derivar(segredo,s,i)};}
async function confere(segredo,reg){
  if(!reg)return false;
  var h=await derivar(segredo,reg.s,reg.i);
  if(h.length!==reg.h.length)return false;
  var r=0;for(var i=0;i<h.length;i++)r|=h.charCodeAt(i)^reg.h.charCodeAt(i);
  return r===0;
}
function gerarCodigo(){var a=aleatorio(16),s='';for(var i=0;i<16;i++){s+=ALFA[a[i]&31];if(i%4===3&&i<15)s+='-';}return s;}
function normCodigo(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function fmtSeg(s){return Math.floor(s/60)+':'+pad(s%60);}

/* digital ou rosto, pelo leitor do próprio aparelho (WebAuthn) */
function bioSuportada(){return !!(window.PublicKeyCredential&&navigator.credentials&&navigator.credentials.create&&navigator.credentials.get);}
async function bioDisponivel(){try{return !!(bioSuportada()&&await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}}
function bioAtiva(){var B=lockCfg();return !!(B&&B.bio&&bioSuportada());}
async function registrarBio(){
  try{
    var cred=await navigator.credentials.create({publicKey:{
      challenge:aleatorio(32),rp:{name:'FinanApp',id:location.hostname},
      user:{id:aleatorio(16),name:'finanapp',displayName:'FinanApp'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},
      timeout:60000,attestation:'none'}});
    if(!cred)return false;
    S.meta.bloqueio.bio={id:b64u(cred.rawId)};salvarMeta();return true;
  }catch(e){return false;}
}
async function autenticarBio(){
  var B=lockCfg();if(!B||!B.bio)return false;
  try{
    var r=await navigator.credentials.get({publicKey:{challenge:aleatorio(32),rpId:location.hostname,
      allowCredentials:[{type:'public-key',id:unb64u(B.bio.id),transports:['internal']}],userVerification:'required',timeout:60000}});
    if(!r||!r.response)return false;
    var ad=new Uint8Array(r.response.authenticatorData);
    return ad.length>32&&(ad[32]&4)===4;   /* bit "usuário verificado" */
  }catch(e){return false;}
}

/* tela de bloqueio e teclado numérico */
function lkEl(id){return document.getElementById(id);}
function lkMsg(t){lkEl('lk-msg').textContent=t||'';}
function lkInert(v){['.app','.nav','#fab','#sheet'].forEach(function(s){var e=document.querySelector(s);if(e){if(v)e.setAttribute('inert','');else e.removeAttribute('inert');}});}
function lkMostrar(){lkEl('lock').hidden=false;lkInert(true);}
function lkFechar(){clearInterval(LK.timer);lkEl('lock').hidden=true;lkInert(false);LK.pin='';LK.cb=null;LK.primeiro=null;}
function lkRestante(){var B=lockCfg();return(B&&B.ate>Date.now())?Math.ceil((B.ate-Date.now())/1000):0;}
function lkTextos(){
  var t={unlock:['FinanApp','Digite seu PIN'],verificar:['Confirme seu PIN','Digite o PIN atual'],
    criar:['Crie um PIN','Escolha '+LK.n+' dígitos'],confirmar:['Repita o PIN','Digite o mesmo PIN de novo']}[LK.modo];
  lkEl('lk-titulo').textContent=t[0];lkEl('lk-sub').textContent=t[1];
}
function lkDesenhar(){
  var d='';for(var i=0;i<LK.n;i++)d+='<i class="'+(i<LK.pin.length?'on':'')+'"></i>';
  var el=lkEl('lk-dots');el.innerHTML=d;el.setAttribute('aria-label',LK.pin.length+' de '+LK.n+' dígitos');
}
function lkMontarPad(){
  var h='';
  for(var d=1;d<=9;d++)h+='<button data-act="lk-d" data-d="'+d+'" aria-label="'+d+'">'+d+'</button>';
  var bio=(LK.modo==='unlock'||LK.modo==='verificar')&&bioAtiva();
  h+=bio?'<button data-act="lk-bio" aria-label="Usar digital ou rosto">'+ICO_BIO+'</button>':'<button class="vazio" tabindex="-1" aria-hidden="true"></button>';
  h+='<button data-act="lk-d" data-d="0" aria-label="0">0</button><button data-act="lk-apagar" aria-label="Apagar">'+ICO_APAGAR+'</button>';
  lkEl('lk-pad').innerHTML=h;
}
function lkAbrir(o){
  LK.modo=o.modo;LK.n=o.n||6;LK.pin='';LK.primeiro=null;LK.cb=o.cb||null;LK.cancelavel=!!o.cancelavel;LK.ocupado=false;
  lkEl('lk-rec').hidden=true;lkEl('lk-teclado').hidden=false;lkMsg('');
  lkTextos();lkMontarPad();lkDesenhar();
  lkEl('lk-cancelar').hidden=!LK.cancelavel;
  lkEl('lk-esqueci').hidden=LK.modo!=='unlock';
  lkMostrar();lkAtualizarBloqueio();
}
function lkAtualizarBloqueio(){
  clearInterval(LK.timer);
  var pad=lkEl('lk-pad'),r=lkRestante();
  if(r>0){
    pad.classList.add('off');lkMsg('Muitas tentativas. Tente de novo em '+fmtSeg(r)+'.');
    LK.timer=setInterval(function(){
      var x=lkRestante();
      if(x<=0){clearInterval(LK.timer);pad.classList.remove('off');lkMsg('');}
      else lkMsg('Muitas tentativas. Tente de novo em '+fmtSeg(x)+'.');
    },1000);
  }else pad.classList.remove('off');
}
function lkTremer(){var d=lkEl('lk-dots');d.classList.remove('tremer');void d.offsetWidth;d.classList.add('tremer');}
function lkDigito(d){
  if(LK.ocupado||LK.pin.length>=LK.n)return;
  if((LK.modo==='unlock'||LK.modo==='verificar')&&lkRestante()>0)return;
  LK.pin+=d;lkMsg('');lkDesenhar();
  if(LK.pin.length===LK.n)lkChecar();
}
function lkApagar(){if(LK.ocupado||!LK.pin.length)return;LK.pin=LK.pin.slice(0,-1);lkDesenhar();}
function lkCancelar(){if(LK.cancelavel)lkFechar();}
function lkSucesso(){
  var cb=LK.cb,modo=LK.modo;
  lkFechar();
  if(modo==='unlock'){
    S.bloqueado=false;render();
    var ac=S.acaoPendente;S.acaoPendente=null;
    if(ac==='nova-compra'&&mesKeys().length)abrirItem(null);
  }else if(cb)cb();
}
async function lkChecar(){
  if(LK.ocupado||LK.pin.length<LK.n)return;
  var pin=LK.pin;LK.ocupado=true;
  try{
    if(LK.modo==='criar'){LK.primeiro=pin;LK.modo='confirmar';LK.pin='';lkTextos();lkDesenhar();lkMontarPad();return;}
    if(LK.modo==='confirmar'){
      if(pin!==LK.primeiro){LK.modo='criar';LK.primeiro=null;LK.pin='';lkTextos();lkDesenhar();lkMsg('Os PINs não conferem. Comece de novo.');lkTremer();return;}
      var cb=LK.cb;lkFechar();
      if(cb)await cb(pin);
      return;
    }
    var B=lockCfg();if(!B||lkRestante()>0)return;
    if(await confere(pin,B.pin)){B.falhas=0;B.ate=0;salvarMeta();lkSucesso();return;}
    B.falhas=(B.falhas||0)+1;
    var rest=5-(B.falhas%5);
    if(B.falhas%5===0)B.ate=Date.now()+Math.min(900,30*Math.pow(2,B.falhas/5-1))*1000;
    salvarMeta();
    LK.pin='';lkDesenhar();lkTremer();
    if(B.ate>Date.now())lkAtualizarBloqueio();
    else lkMsg(rest<=2?('PIN incorreto. Restam '+rest+' tentativa'+(rest>1?'s':'')+' antes de uma pausa.'):'PIN incorreto.');
  }finally{LK.ocupado=false;}
}
async function lkBio(){
  if(LK.ocupado||!bioAtiva()||(LK.modo!=='unlock'&&LK.modo!=='verificar')||lkRestante()>0)return;
  LK.ocupado=true;
  var ok=false;
  try{ok=await autenticarBio();}finally{LK.ocupado=false;}
  if(ok){var B=lockCfg();if(B){B.falhas=0;B.ate=0;salvarMeta();}lkSucesso();}
  else lkMsg('Não foi possível usar a digital ou o rosto. Digite o PIN.');
}
function lkAbrirUnlock(){
  var B=lockCfg();if(!B)return;
  lkAbrir({modo:'unlock',n:B.pin.n});
  if(bioAtiva()&&lkRestante()===0)setTimeout(lkBio,350);
}
function bloquear(){
  if(!lockAtivo()||S.bloqueado)return;
  S.bloqueado=true;fecharSheet();$('#toast').hidden=true;render();lkAbrirUnlock();
}

/* esqueci o PIN */
function lkEsqueci(){

function lkRecVoltar(){lkEl('lk-rec').hidden=true;lkEl('lk-teclado').hidden=false;}
async function lkUsarCodigo(){
  var B=lockCfg(),cod=normCodigo(lkEl('lk-cod').value),msg=lkEl('lk-rec-msg');
  if(!B)return;
  if(cod.length!==16){msg.textContent='O código tem 16 letras e números.';return;}
  if(!(await confere(cod,B.rec))){msg.textContent='Código incorreto.';return;}
  B.falhas=0;B.ate=0;salvarMeta();
  lkAbrir({modo:'criar',n:B.pin.n,cancelavel:false,cb:async function(pin){
    var reg=await novoSegredo(pin),B2=lockCfg();
    B2.pin={s:reg.s,i:reg.i,h:reg.h,n:B2.pin.n};B2.falhas=0;B2.ate=0;salvarMeta();
    S.bloqueado=false;render();toast('PIN redefinido.');
    var ac=S.acaoPendente;S.acaoPendente=null;
    if(ac==='nova-compra'&&mesKeys().length)abrirItem(null);
  }});
  lkEl('lk-sub').textContent='Código aceito. Crie um novo PIN de '+B.pin.n+' dígitos.';
}
function lkApagarTudo(){
  if(lkEl('lk-apagar-txt').value.trim().toUpperCase()!=='APAGAR')return;

async function lkConcluirCriacao(pin,n){
